server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_db
    username: "${BD_USER}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    secret-key: "${JWT_SECRET}"
    expiration: 900000    # 15 minutos
